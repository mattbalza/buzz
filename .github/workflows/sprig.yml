name: Sprig

# Builds and publishes Sprig — one deploy-anywhere Linux multicall binary for:
#   buzz-acp       ACP harness that bridges Buzz events to the LLM agent
#   buzz-agent     ACP-compliant agent (spawns MCP, calls LLMs)
#   buzz-dev-mcp   Developer MCP server (multicall: rg, tree, buzz,
#                    git-credential-nostr, git-sign-nostr)
#
# Targets: x86_64-unknown-linux-musl and aarch64-unknown-linux-musl (static
# musl so the tarball runs on any modern Linux without libc surprises).
#
# Triggers:
#   - push to main     → updates rolling `sprig-latest` release
#   - tag `sprig-v*`  → versioned release
#   - workflow_dispatch → manual canary build (no release publish unless asked)

on:
  push:
    branches: [main]
    tags: ["sprig-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the rolling release (otherwise artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install cross
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2.79.15
        with:
          tool: cross@0.2.5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="sprig") | .version')

          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/sprig-v* ]]; then
            VERSION="${REF#sprig-v}"
            CHANNEL="tag"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            VERSION="${WORKSPACE_VERSION}+git.${SHORT_SHA}"
            CHANNEL="rolling"
          fi
          {
            echo "workspace_version=$WORKSPACE_VERSION"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION channel=$CHANNEL"

      - name: Build & package Sprig
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "tag" ]]; then
            ARCHIVE_BASENAME="sprig-${VERSION}-${TARGET}"
          else
            ARCHIVE_BASENAME="sprig-${TARGET}"
          fi
          ARCHIVE_BASENAME="$ARCHIVE_BASENAME" \
            ./scripts/build-sprig.sh "$VERSION" "$TARGET"
          ARCHIVE="dist/${ARCHIVE_BASENAME}.tar.gz"
          test -f "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_BASENAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sprig-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish rolling release
    needs: build
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sprig-rolling-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all Sprig artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: sprig-*
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$SHA" != "$CURRENT_MAIN" ]]; then
            echo "Skipping stale Sprig publish for $SHA; main is $CURRENT_MAIN"
            exit 0
          fi
          TAG="sprig-latest"
          TITLE="Sprig (rolling)"
          NOTES="Rolling Linux build of Sprig (all-in-one buzz-acp + buzz-agent + buzz-dev-mcp), tracking \`main\` (\`${SHA}\`)."

          # GitHub ignores target_commitish when a tag already exists. Move the
          # rolling lightweight tag explicitly, then verify its exact object.
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/tags/${TAG}" \
              -f sha="$SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$SHA" >/dev/null
          fi
          REMOTE_TAG_SHA="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$REMOTE_TAG_SHA" = "$SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --prerelease \
              --verify-tag \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          # The content-addressed bundle is immutable. The manifest is uploaded
          # last and acts as the atomic pointer consumers verify before install.
          BUNDLE_TMP="${RUNNER_TEMP}/sprig-bundle.tar.gz"
          tar -C dist -czf "$BUNDLE_TMP" .
          BUNDLE_SHA256="$(sha256sum "$BUNDLE_TMP" | cut -d' ' -f1)"
          BUNDLE_NAME="sprig-bundle-${SHA}-${BUNDLE_SHA256}.tar.gz"
          BUNDLE_PATH="${RUNNER_TEMP}/${BUNDLE_NAME}"
          mv "$BUNDLE_TMP" "$BUNDLE_PATH"

          if gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -Fqx "$BUNDLE_NAME"; then
            VERIFY_DIR="$(mktemp -d)"
            gh release download "$TAG" --pattern "$BUNDLE_NAME" --dir "$VERIFY_DIR"
            test "$(sha256sum "$VERIFY_DIR/$BUNDLE_NAME" | cut -d' ' -f1)" = "$BUNDLE_SHA256"
          else
            gh release upload "$TAG" "$BUNDLE_PATH"
          fi

          PREVIOUS_BUNDLE=""
          PREVIOUS_MANIFEST_DIR="$(mktemp -d)"
          if gh release download "$TAG" --pattern sprig-manifest.json \
            --dir "$PREVIOUS_MANIFEST_DIR" 2>/dev/null; then
            if ! PREVIOUS_BUNDLE="$(jq -r \
              'if .schema_version == 1 and (.bundle | type == "string") then .bundle else empty end' \
              "$PREVIOUS_MANIFEST_DIR/sprig-manifest.json")"; then
              PREVIOUS_BUNDLE=""
            fi
          fi

          MANIFEST_PATH="${RUNNER_TEMP}/sprig-manifest.json"
          jq -n \
            --arg git_sha "$SHA" \
            --arg bundle "$BUNDLE_NAME" \
            --arg sha256 "$BUNDLE_SHA256" \
            '{schema_version: 1, git_sha: $git_sha, bundle: $bundle, sha256: $sha256}' \
            > "$MANIFEST_PATH"
          gh release upload "$TAG" "$MANIFEST_PATH" --clobber

          VERIFY_DIR="$(mktemp -d)"
          gh release download "$TAG" --pattern sprig-manifest.json --dir "$VERIFY_DIR"
          test "$(jq -r '.git_sha' "$VERIFY_DIR/sprig-manifest.json")" = "$SHA"
          test "$(jq -r '.bundle' "$VERIFY_DIR/sprig-manifest.json")" = "$BUNDLE_NAME"
          test "$(jq -r '.sha256' "$VERIFY_DIR/sprig-manifest.json")" = "$BUNDLE_SHA256"

          # Retain the active bundle plus one rollback bundle. Cleanup happens
          # only after the manifest pointer has been downloaded and verified.
          RELEASE_ID="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id')"
          ASSET_INDEX="$(mktemp)"
          gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | select(.name | startswith("sprig-bundle-")) | [.created_at, (.id | tostring), .name] | @tsv' \
            | sort -r > "$ASSET_INDEX"
          CURRENT_BUNDLE_PREFIX="sprig-bundle-${SHA}-"
          ROLLBACK_BUNDLE=""
          if [[ -n "$PREVIOUS_BUNDLE" && "$PREVIOUS_BUNDLE" != "$BUNDLE_NAME" ]] \
            && [[ "$PREVIOUS_BUNDLE" != "$CURRENT_BUNDLE_PREFIX"* ]] \
            && awk -F '\t' -v previous="$PREVIOUS_BUNDLE" '$3 == previous { found = 1 } END { exit !found }' "$ASSET_INDEX"; then
            ROLLBACK_BUNDLE="$PREVIOUS_BUNDLE"
          else
            ROLLBACK_BUNDLE="$(awk -F '\t' -v prefix="$CURRENT_BUNDLE_PREFIX" \
              'index($3, prefix) != 1 { print $3; exit }' "$ASSET_INDEX")"
          fi
          while IFS=$'\t' read -r _created_at asset_id asset_name; do
            if [[ "$asset_name" != "$BUNDLE_NAME" && "$asset_name" != "$ROLLBACK_BUNDLE" ]]; then
              gh api --method DELETE "repos/${REPO}/releases/assets/${asset_id}"
            fi
          done < "$ASSET_INDEX"

  publish-tag:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/sprig-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download all Sprig artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: sprig-*
          merge-multiple: true

      - name: Resolve tag version
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          VERSION="${REF#sprig-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Create tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Sprig v${VERSION}" \
            --notes "Sprig v${VERSION} — Linux all-in-one builds of buzz-acp + buzz-agent + buzz-dev-mcp." \
            dist/*
